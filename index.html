<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --cfs-red:#D7182A;--cfs-blue:#1268B3;--cfs-magenta:#A01D51;--gray:#929497;
    --ink:#1c2024;--line:#e3e6ea;--bg:#f5f7f9;--card:#fff;--muted:#6b7280;
    --ok:#1f9d57;--warn:#e0a106;--shadow:0 1px 2px rgba(16,24,40,.06),0 4px 14px rgba(16,24,40,.05);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.45;-webkit-font-smoothing:antialiased}
  header.topbar{background:#fff;border-bottom:1px solid var(--line);padding:14px 24px;
    display:flex;align-items:center;gap:18px;position:sticky;top:0;z-index:20}
  .logo{height:34px;flex-shrink:0}
  .topbar h1{font-size:15px;font-weight:600;border-left:1px solid var(--line);padding-left:18px;letter-spacing:.2px}
  .topbar .spacer{flex:1}
  .btn{font:inherit;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--line);
    background:#fff;color:var(--ink);padding:8px 14px;border-radius:8px;transition:.15s}
  .btn:hover{border-color:var(--cfs-blue);color:var(--cfs-blue)}
  .btn.primary{background:var(--cfs-blue);border-color:var(--cfs-blue);color:#fff}
  .btn.primary:hover{background:#0f579b;color:#fff}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  .wrap{max-width:1280px;margin:0 auto;padding:24px}
  .banner{background:#fff7e6;border:1px solid #f3d27a;color:#7a5b00;border-radius:10px;
    padding:12px 16px;margin-bottom:18px;font-size:13px;display:none}
  .banner.show{display:block}
  .lock-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;
    padding:6px 12px;border-radius:99px;background:#f0f1f2;color:#5d6166;cursor:pointer}
  .lock-pill.unlocked{background:#e6f6ee;color:var(--ok)}
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:22px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;
    box-shadow:var(--shadow);position:relative;overflow:hidden}
  .kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gray)}
  .kpi.total::before{background:linear-gradient(var(--cfs-red),var(--cfs-blue))}
  .kpi.track::before{background:var(--ok)}.kpi.risk::before{background:var(--cfs-red)}
  .kpi.done::before{background:var(--cfs-blue)}.kpi.hold::before{background:var(--gray)}
  .kpi .num{font-size:28px;font-weight:700;line-height:1}
  .kpi .lbl{font-size:12px;color:var(--muted);margin-top:6px;text-transform:uppercase;letter-spacing:.5px}
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  .toolbar input[type=search]{flex:1;min-width:180px;font:inherit;font-size:14px;padding:9px 12px;
    border:1px solid var(--line);border-radius:8px;background:#fff}
  .toolbar select{font:inherit;font-size:13px;padding:9px 10px;border:1px solid var(--line);
    border-radius:8px;background:#fff;color:var(--ink)}
  .toolbar input:focus,.toolbar select:focus{outline:2px solid var(--cfs-blue);outline-offset:-1px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
  table{width:100%;border-collapse:collapse;font-size:14px}
  thead th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);
    font-weight:700;padding:13px 16px;border-bottom:1px solid var(--line);background:#fafbfc;cursor:pointer;
    user-select:none;white-space:nowrap}
  thead th:hover{color:var(--cfs-blue)}
  thead th.nosort{cursor:default}thead th.nosort:hover{color:var(--muted)}
  tbody td{padding:13px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
  tbody tr.proj-row:hover{background:#f8fafc}
  .proj-name{font-weight:600}.proj-meta{font-size:12px;color:var(--muted);margin-top:2px}
  .caret{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:6px;
    cursor:pointer;color:var(--muted);font-size:11px;transition:.15s;flex-shrink:0}
  .caret:hover{background:#eef0f3;color:var(--ink)}
  .caret.open{transform:rotate(90deg)}
  .name-cell{display:flex;align-items:flex-start;gap:8px}
  .subcount{display:inline-block;font-size:11px;font-weight:600;color:var(--muted);background:#f0f1f2;
    border-radius:99px;padding:1px 7px;margin-left:6px;vertical-align:middle}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:4px 9px;border-radius:99px;
    text-transform:uppercase;letter-spacing:.4px;white-space:nowrap}
  .b-track{background:#e6f6ee;color:var(--ok)}.b-risk{background:#fdeaec;color:var(--cfs-red)}
  .b-done{background:#e8f1fa;color:var(--cfs-blue)}.b-hold{background:#f0f1f2;color:#5d6166}
  .prio{font-size:12px;font-weight:600}.prio.high{color:var(--cfs-red)}
  .prio.medium{color:var(--warn)}.prio.low{color:var(--muted)}
  .pbar{height:7px;border-radius:99px;background:#eef0f3;overflow:hidden;width:110px}
  .pbar>i{display:block;height:100%;border-radius:99px;background:var(--cfs-blue)}
  .pbar.full>i{background:var(--ok)}
  .pwrap{display:flex;align-items:center;gap:9px}
  .pwrap span{font-size:12px;font-weight:600;color:var(--muted);min-width:32px}
  .auto-tag{font-size:10px;font-weight:700;color:var(--cfs-blue);background:#e8f1fa;border-radius:4px;padding:1px 5px;text-transform:uppercase;letter-spacing:.3px}
  .owner{display:flex;align-items:center;gap:8px}
  .avatar{width:26px;height:26px;border-radius:50%;background:var(--cfs-blue);color:#fff;font-size:11px;
    font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .due{font-size:13px}.due.over{color:var(--cfs-red);font-weight:600}.due.soon{color:var(--warn);font-weight:600}
  .row-actions{display:flex;gap:6px;opacity:0;transition:.15s}
  tbody tr.proj-row:hover .row-actions{opacity:1}
  .icon-btn{border:none;background:none;cursor:pointer;font-size:14px;color:var(--muted);padding:4px 6px;border-radius:6px}
  .icon-btn:hover{background:#eef0f3;color:var(--ink)}.icon-btn.del:hover{color:var(--cfs-red)}
  /* sub-task drawer */
  tr.sub-row>td{padding:0;border-bottom:1px solid var(--line);background:#fafbfc}
  .sub-wrap{padding:6px 16px 14px 46px}
  .sub-item{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:8px}
  .sub-item:hover{background:#f0f2f5}
  .sub-item input[type=checkbox]{width:16px;height:16px;accent-color:var(--cfs-blue);cursor:pointer;flex-shrink:0}
  .sub-item .stitle{flex:1;font-size:13px}
  .sub-item.done .stitle{text-decoration:line-through;color:var(--muted)}
  .sub-del{border:none;background:none;cursor:pointer;color:var(--muted);font-size:13px;padding:3px 6px;border-radius:6px;opacity:0}
  .sub-item:hover .sub-del{opacity:1}.sub-del:hover{color:var(--cfs-red);background:#fdeaec}
  .sub-add{display:flex;gap:8px;align-items:center;padding:8px 8px 2px}
  .sub-add input{flex:1;font:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:7px}
  .sub-add input:focus{outline:2px solid var(--cfs-blue);outline-offset:-1px}
  .sub-add button{font:inherit;font-size:12px;font-weight:600;padding:7px 12px;border-radius:7px;border:1px solid var(--cfs-blue);
    background:var(--cfs-blue);color:#fff;cursor:pointer}
  .sub-empty{font-size:12px;color:var(--muted);padding:6px 8px}
  .sub-toggle{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);padding:4px 8px 0;cursor:pointer;user-select:none}
  .sub-toggle input{accent-color:var(--cfs-blue);cursor:pointer}
  .empty{padding:50px 20px;text-align:center;color:var(--muted)}
  .empty h3{color:var(--ink);font-size:16px;margin-bottom:6px}
  .overlay{position:fixed;inset:0;background:rgba(20,28,38,.45);display:none;align-items:center;
    justify-content:center;z-index:50;padding:20px}
  .overlay.show{display:flex}
  .modal{background:#fff;border-radius:14px;width:100%;max-width:540px;max-height:90vh;overflow:auto;
    box-shadow:0 20px 60px rgba(0,0,0,.3)}
  .modal.sm{max-width:380px}
  .modal h2{font-size:17px;padding:18px 22px;border-bottom:1px solid var(--line)}
  .modal .body{padding:20px 22px;display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .modal .body.single{grid-template-columns:1fr}
  .field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}
  .field label{font-size:12px;font-weight:600;color:var(--muted)}
  .field input,.field select,.field textarea{font:inherit;font-size:14px;padding:9px 11px;
    border:1px solid var(--line);border-radius:8px;background:#fff}
  .field input:disabled{background:#f0f1f2;color:var(--muted)}
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--cfs-blue);outline-offset:-1px}
  .field textarea{resize:vertical;min-height:60px}
  .field .hint{font-size:11px;color:var(--muted)}
  .modal .foot{padding:16px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}
  .status-msg{font-size:12px;color:var(--muted);margin-left:auto}
  .err{color:var(--cfs-red);font-size:12px;font-weight:600;min-height:16px}
  @media(max-width:980px){.kpis{grid-template-columns:repeat(2,1fr)}.hide-sm{display:none}.modal .body{grid-template-columns:1fr}}
  @media(max-width:560px){.topbar h1{display:none}.wrap{padding:14px}}
</style>

    <text x="345" y="170" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="58" fill="#1268B3">MERITECH</text>
    <text x="745" y="170" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-style="italic" font-size="58" fill="#1268B3">Lafferty</text>

<script>
let sb=null, projects=[], subtasks={}, editingId=null, canEdit=false, sortKey="due", sortDir=1;
let openRows=new Set();
const $=s=>document.querySelector(s);
const tbody=$("#tbody");

function showBanner(msg){ const b=$("#banner"); b.textContent=msg; b.classList.add("show"); }
function flash(m){ $("#statusMsg").textContent=m; clearTimeout(flash.t); flash.t=setTimeout(()=>$("#statusMsg").textContent="",2500); }

/* ---------- init Supabase ---------- */
function initDB(){
  if(SUPABASE_URL.includes("YOUR-PROJECT")||SUPABASE_KEY.includes("YOUR_")){
    showBanner("⚙️ Not connected yet. Open this file and fill in SUPABASE_URL and SUPABASE_KEY at the top (see the setup steps).");
    return false;
  }
  try{ sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY); return true; }
  catch(e){ showBanner("Could not connect to the database. Double-check your URL and key."); return false; }
}

async function loadProjects(){
  if(!sb) return;
  const {data,error}=await sb.from("projects").select("*").order("due",{ascending:true});
  if(error){ showBanner("Couldn't load projects: "+error.message); return; }
  projects=data||[];
  const {data:st,error:e2}=await sb.from("subtasks").select("*").order("id",{ascending:true});
  if(e2){ showBanner("Couldn't load sub-tasks: "+e2.message); }
  subtasks={};
  (st||[]).forEach(s=>{ (subtasks[s.project_id]=subtasks[s.project_id]||[]).push(s); });
  render();
}

/* ---------- progress helpers ---------- */
function computedProgress(p){
  if(!p.auto_progress) return +p.progress||0;
  const list=subtasks[p.id]||[];
  if(!list.length) return 0;
  return Math.round(list.filter(s=>s.done).length/list.length*100);
}

/* ---------- misc helpers ---------- */
function initials(n){ return (n||"?").split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase(); }
function statusClass(s){ return {"On track":"b-track","At risk":"b-risk","Complete":"b-done","On hold":"b-hold"}[s]||"b-hold"; }
function daysUntil(d){ if(!d) return null; return Math.round((new Date(d)-new Date().setHours(0,0,0,0))/864e5); }
function fmtDue(d){
  if(!d) return {txt:"—",cls:""};
  const n=daysUntil(d), txt=new Date(d).toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});
  if(n<0) return {txt:txt+" · overdue",cls:"over"};
  if(n<=7) return {txt:txt+" · "+n+"d",cls:"soon"};
  return {txt,cls:""};
}
function esc(s){ return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ---------- render ---------- */
function render(){
  const q=$("#search").value.toLowerCase(), sf=$("#statusFilter").value, pf=$("#prioFilter").value;
  let list=projects.filter(p=>{
    const hay=((p.name||"")+" "+(p.owner||"")+" "+(p.tag||"")+" "+(p.notes||"")).toLowerCase();
    return (!q||hay.includes(q))&&(!sf||p.status===sf)&&(!pf||p.priority===pf);
  });
  list.sort((a,b)=>{
    let x=sortKey==="progress"?computedProgress(a):a[sortKey];
    let y=sortKey==="progress"?computedProgress(b):b[sortKey];
    if(x==null)x=""; if(y==null)y="";
    if(x<y)return -sortDir; if(x>y)return sortDir; return 0;
  });
  renderKpis();
  tbody.innerHTML="";
  $("#empty").style.display=list.length?"none":"block";
  for(const p of list){
    const due=fmtDue(p.due), prog=computedProgress(p), full=(prog>=100);
    const subs=subtasks[p.id]||[], isOpen=openRows.has(p.id);
    const tr=document.createElement("tr");
    tr.className="proj-row";
    tr.innerHTML=`
      <td><div class="name-cell">
        <span class="caret ${isOpen?'open':''}" data-toggle="${p.id}">▶</span>
        <div><div class="proj-name">${esc(p.name)}${subs.length?`<span class="subcount">${subs.filter(s=>s.done).length}/${subs.length}</span>`:""}</div>
        <div class="proj-meta">${esc(p.tag||"")}${p.notes?" · "+esc(p.notes.slice(0,52))+(p.notes.length>52?"…":""):""}</div></div>
      </div></td>
      <td><span class="badge ${statusClass(p.status)}">${esc(p.status)}</span></td>
      <td><div class="pwrap"><div class="pbar ${full?'full':''}"><i style="width:${Math.min(100,Math.max(0,prog))}%"></i></div>
        <span>${prog}%</span>${p.auto_progress?' <span class="auto-tag">auto</span>':''}</div></td>
      <td class="hide-sm"><span class="prio ${(p.priority||'').toLowerCase()}">${esc(p.priority)}</span></td>
      <td class="hide-sm"><div class="owner"><div class="avatar">${initials(p.owner)}</div>${esc(p.owner||"—")}</div></td>
      <td><span class="due ${due.cls}">${due.txt}</span></td>
      <td>${canEdit?`<div class="row-actions">
        <button class="icon-btn" title="Edit" data-edit="${p.id}">✏️</button>
        <button class="icon-btn del" title="Delete" data-del="${p.id}">🗑️</button></div>`:""}</td>`;
    tbody.appendChild(tr);
    if(isOpen) tbody.appendChild(subRow(p,subs));
  }
}

function subRow(p,subs){
  const tr=document.createElement("tr");
  tr.className="sub-row";
  let items = subs.length
    ? subs.map(s=>`<div class="sub-item ${s.done?'done':''}">
        <input type="checkbox" ${s.done?'checked':''} ${canEdit?'':'disabled'} data-check="${s.id}">
        <span class="stitle">${esc(s.title)}</span>
        ${canEdit?`<button class="sub-del" title="Delete" data-subdel="${s.id}">🗑️</button>`:""}
      </div>`).join("")
    : `<div class="sub-empty">No sub-tasks yet.${canEdit?" Add the first one below.":""}</div>`;
  const adder = canEdit ? `
    <div class="sub-add">
      <input type="text" placeholder="New sub-task…" data-subadd-input="${p.id}">
      <button data-subadd="${p.id}">Add</button>
    </div>
    <label class="sub-toggle"><input type="checkbox" ${p.auto_progress?'checked':''} data-autoprog="${p.id}">
      Auto-calculate this project's progress from the checklist</label>` : "";
  tr.innerHTML=`<td colspan="7"><div class="sub-wrap">${items}${adder}</div></td>`;
  return tr;
}

function renderKpis(){
  const c=s=>projects.filter(p=>p.status===s).length;
  $("#kpis").innerHTML=`
    <div class="kpi total"><div class="num">${projects.length}</div><div class="lbl">Total projects</div></div>
    <div class="kpi track"><div class="num">${c("On track")}</div><div class="lbl">On track</div></div>
    <div class="kpi risk"><div class="num">${c("At risk")}</div><div class="lbl">At risk</div></div>
    <div class="kpi hold"><div class="num">${c("On hold")}</div><div class="lbl">On hold</div></div>
    <div class="kpi done"><div class="num">${c("Complete")}</div><div class="lbl">Complete</div></div>`;
}

/* ---------- editing gate ---------- */
function setEditing(on){
  canEdit=on;
  $("#addBtn").disabled=!on;
  const pill=$("#lockPill");
  pill.textContent=on?"🔓 Editing on":"🔒 View only";
  pill.classList.toggle("unlocked",on);
  render();
}
$("#lockPill").onclick=()=>{
  if(canEdit){ setEditing(false); return; }
  $("#pw-input").value=""; $("#pw-err").textContent=""; $("#pwOverlay").classList.add("show"); $("#pw-input").focus();
};
$("#pw-cancel").onclick=()=>$("#pwOverlay").classList.remove("show");
$("#pw-ok").onclick=()=>{
  if($("#pw-input").value===EDIT_PASSWORD){ $("#pwOverlay").classList.remove("show"); setEditing(true); flash("Editing unlocked"); }
  else $("#pw-err").textContent="Incorrect password.";
};
$("#pw-input").addEventListener("keydown",e=>{ if(e.key==="Enter")$("#pw-ok").click(); });

/* ---------- add/edit project modal ---------- */
function syncProgField(){
  const auto=$("#f-autoprog").checked;
  $("#f-progress").disabled=auto;
  $("#progHint").textContent=auto?"Set automatically from sub-tasks":"";
}
$("#f-autoprog").onchange=syncProgField;
function openModal(p){
  editingId=p?p.id:null;
  $("#modalTitle").textContent=p?"Edit project":"New project";
  $("#f-name").value=p?.name||""; $("#f-status").value=p?.status||"On track";
  $("#f-priority").value=p?.priority||"Medium"; $("#f-progress").value=p?.progress??0;
  $("#f-owner").value=p?.owner||""; $("#f-due").value=p?.due||"";
  $("#f-tag").value=p?.tag||"Meritech"; $("#f-notes").value=p?.notes||"";
  $("#f-autoprog").checked=!!p?.auto_progress; syncProgField();
  $("#overlay").classList.add("show"); $("#f-name").focus();
}
function closeModal(){ $("#overlay").classList.remove("show"); }
async function saveFromModal(){
  if(!sb){ flash("Not connected to database"); return; }
  const name=$("#f-name").value.trim();
  if(!name){ $("#f-name").focus(); flash("Project name is required"); return; }
  const row={
    name, status:$("#f-status").value, priority:$("#f-priority").value,
    progress:Math.min(100,Math.max(0,+$("#f-progress").value||0)),
    owner:$("#f-owner").value.trim(), due:$("#f-due").value||null,
    tag:$("#f-tag").value, notes:$("#f-notes").value.trim(),
    auto_progress:$("#f-autoprog").checked
  };
  $("#saveBtn").disabled=true; flash("Saving…");
  let error;
  if(editingId){ ({error}=await sb.from("projects").update(row).eq("id",editingId)); }
  else { ({error}=await sb.from("projects").insert(row)); }
  $("#saveBtn").disabled=false;
  if(error){ flash("Save failed: "+error.message); return; }
  closeModal(); flash("Saved ✓"); await loadProjects();
}

/* ---------- sub-task operations ---------- */
async function addSubtask(projectId,input){
  const title=input.value.trim(); if(!title) return;
  input.disabled=true;
  const {error}=await sb.from("subtasks").insert({project_id:projectId,title,done:false});
  input.disabled=false;
  if(error){ flash("Add failed: "+error.message); return; }
  input.value=""; openRows.add(projectId); await loadProjects();
  const again=document.querySelector(`[data-subadd-input="${projectId}"]`); if(again) again.focus();
}
async function toggleSubtask(id,done){
  const {error}=await sb.from("subtasks").update({done}).eq("id",id);
  if(error){ flash("Update failed: "+error.message); return; }
  await loadProjects();
}
async function deleteSubtask(id){
  const {error}=await sb.from("subtasks").delete().eq("id",id);
  if(error){ flash("Delete failed: "+error.message); return; }
  await loadProjects();
}
async function setAutoProgress(projectId,on){
  const {error}=await sb.from("projects").update({auto_progress:on}).eq("id",projectId);
  if(error){ flash("Update failed: "+error.message); return; }
  await loadProjects();
}

/* ---------- events ---------- */
$("#addBtn").onclick=()=>openModal(null);
$("#cancelBtn").onclick=closeModal;
$("#saveBtn").onclick=saveFromModal;
$("#overlay").onclick=e=>{ if(e.target===$("#overlay"))closeModal(); };
$("#pwOverlay").onclick=e=>{ if(e.target===$("#pwOverlay"))$("#pwOverlay").classList.remove("show"); };
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){closeModal();$("#pwOverlay").classList.remove("show");} });
$("#search").oninput=render; $("#statusFilter").onchange=render; $("#prioFilter").onchange=render;

tbody.addEventListener("click",async e=>{
  const t=e.target;
  const tog=t.dataset.toggle;
  if(tog){ const id=+tog; if(openRows.has(id))openRows.delete(id); else openRows.add(id); render(); return; }
  const ed=t.dataset.edit, dl=t.dataset.del, subdel=t.dataset.subdel, subadd=t.dataset.subadd;
  if(ed) openModal(projects.find(p=>p.id==ed));
  else if(dl){
    const p=projects.find(x=>x.id==dl);
    if(confirm(`Delete "${p.name}" and all its sub-tasks? This can't be undone.`)){
      const {error}=await sb.from("projects").delete().eq("id",dl);
      if(error){ flash("Delete failed: "+error.message); return; }
      flash("Deleted"); await loadProjects();
    }
  }
  else if(subdel) deleteSubtask(+subdel);
  else if(subadd) addSubtask(+subadd, document.querySelector(`[data-subadd-input="${subadd}"]`));
});
tbody.addEventListener("change",e=>{
  const chk=e.target.dataset.check, auto=e.target.dataset.autoprog;
  if(chk) toggleSubtask(+chk, e.target.checked);
  else if(auto) setAutoProgress(+auto, e.target.checked);
});
tbody.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.dataset.subaddInput) addSubtask(+e.target.dataset.subaddInput, e.target);
});

document.querySelectorAll("thead th[data-sort]").forEach(th=>{
  th.onclick=()=>{ const k=th.dataset.sort; if(sortKey===k)sortDir*=-1; else {sortKey=k;sortDir=1;} render(); };
});
$("#exportBtn").onclick=()=>{
  const cols=["name","status","progress","priority","owner","due","tag","notes"];
  const rows=[cols.join(",")].concat(projects.map(p=>{
    const r={...p,progress:computedProgress(p)};
    return cols.map(c=>`"${(r[c]??"").toString().replace(/"/g,'""')}"`).join(",");
  }));
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([rows.join("\n")],{type:"text/csv"}));
  a.download="cfs-projects-"+new Date().toISOString().slice(0,10)+".csv"; a.click();
};

/* ---------- boot ---------- */
if(initDB()) loadProjects();
</script>
</body>
</html>
